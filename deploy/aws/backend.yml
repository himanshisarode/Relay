AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Relay backend on AWS: FastAPI on App Runner, PostgreSQL 16 on RDS, and an EventBridge rule that calls the
  job endpoint every minute. The React frontend is hosted separately on Amplify (see docs/deploy-aws.md).
  Deploy with deploy/aws/deploy-backend.sh rather than by hand; it builds and pushes the image first.

Parameters:
  ImageUri:
    Type: String
    Description: ECR image for the backend, e.g. 123456789012.dkr.ecr.ap-south-1.amazonaws.com/relay-backend:abc123
  DbPassword:
    Type: String
    NoEcho: true
    MinLength: 16
    AllowedPattern: "[A-Za-z0-9]+"
    Description: RDS master password (letters and digits only, so it is safe inside the connection URL)
  CronKey:
    Type: String
    NoEcho: true
    MinLength: 24
    Description: Shared secret EventBridge sends to /api/internal/jobs/tick
  FrontendUrl:
    Type: String
    Description: The Amplify app address, e.g. https://main.d1abc2def3.amplifyapp.com (used in email links)
  SmtpHost:
    Type: String
    Default: ""
  SmtpPort:
    Type: String
    Default: "587"
  SmtpUser:
    Type: String
    Default: ""
  SmtpPassword:
    Type: String
    NoEcho: true
    Default: ""
  SmtpFrom:
    Type: String
    Default: "Relay <no-reply@example.org>"
  SeedOnStart:
    Type: String
    Default: demo
    AllowedValues: [demo, org, none]
    Description: demo = sample departments, people and bookings; org = departments/labs/resources only

Resources:
  # ---- Database --------------------------------------------------------------------------------------------
  # App Runner has no fixed outbound IPs, and reaching a private database would need a NAT gateway (a monthly
  # cost) for the API to still send email. So the database is reachable from the internet, but only over TLS
  # (forced by the parameter group) and only with a long random password. See "Tightening" in docs/deploy-aws.md.
  DbParameters:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: Relay - force TLS
      Family: postgres16
      Parameters:
        rds.force_ssl: "1"

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Relay database - PostgreSQL over TLS
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 0.0.0.0/0

  Database:
    Type: AWS::RDS::DBInstance
    Metadata:
      cfn-lint:
        config:
          # Secrets come in as NoEcho parameters generated by deploy-backend.sh; moving them to Secrets Manager is
          # listed under "Tightening" in docs/deploy-aws.md.
          ignore_checks: [W1011]
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: "16.15" # matches postgres:16 used in local dev and tests; minor upgrades are automatic
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      DBName: relay
      MasterUsername: relay
      MasterUserPassword: !Ref DbPassword
      DBParameterGroupName: !Ref DbParameters
      VPCSecurityGroups: [!GetAtt DbSecurityGroup.GroupId]
      PubliclyAccessible: true
      BackupRetentionPeriod: 7
      PreferredBackupWindow: "20:30-21:00" # 02:00-02:30 IST
      AutoMinorVersionUpgrade: true

  # ---- API ----------------------------------------------------------------------------------------------------
  EcrAccessRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: build.apprunner.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess

  Api:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: relay-api
      SourceConfiguration:
        AutoDeploymentsEnabled: false
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt EcrAccessRole.Arn
        ImageRepository:
          ImageRepositoryType: ECR
          ImageIdentifier: !Ref ImageUri
          ImageConfiguration:
            Port: "8000"
            RuntimeEnvironmentVariables:
              - Name: RELAY_DATABASE_URL
                Value: !Sub "postgresql+psycopg://relay:${DbPassword}@${Database.Endpoint.Address}:5432/relay?sslmode=require"
              - Name: RELAY_BASE_URL
                Value: !Ref FrontendUrl
              - Name: RELAY_COOKIE_SECURE
                Value: "true"
              - Name: RELAY_CRON_KEY
                Value: !Ref CronKey
              - Name: RELAY_SEED_ON_START
                Value: !Ref SeedOnStart
              - Name: RELAY_SMTP_HOST
                Value: !Ref SmtpHost
              - Name: RELAY_SMTP_PORT
                Value: !Ref SmtpPort
              - Name: RELAY_SMTP_USER
                Value: !Ref SmtpUser
              - Name: RELAY_SMTP_PASSWORD
                Value: !Ref SmtpPassword
              - Name: RELAY_SMTP_FROM
                Value: !Ref SmtpFrom
              - Name: RELAY_SMTP_STARTTLS
                Value: "true"
      InstanceConfiguration:
        Cpu: "0.5 vCPU"
        Memory: "1 GB"
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /health
        Interval: 10
        Timeout: 5
        HealthyThreshold: 1
        UnhealthyThreshold: 5
      AutoScalingConfigurationArn: !GetAtt ApiScaling.AutoScalingConfigurationArn

  ApiScaling:
    Type: AWS::AppRunner::AutoScalingConfiguration
    Properties:
      AutoScalingConfigurationName: relay-api-scaling
      MinSize: 1
      MaxSize: 2
      MaxConcurrency: 50

  # ---- Background jobs: EventBridge calls the API every minute -------------------------------------------------
  JobsConnection:
    Type: AWS::Events::Connection
    Properties:
      Description: Relay scheduler key
      AuthorizationType: API_KEY
      AuthParameters:
        ApiKeyAuthParameters:
          ApiKeyName: X-Relay-Cron-Key
          ApiKeyValue: !Ref CronKey

  JobsDestination:
    Type: AWS::Events::ApiDestination
    Properties:
      ConnectionArn: !GetAtt JobsConnection.Arn
      HttpMethod: POST
      InvocationEndpoint: !Sub "https://${Api.ServiceUrl}/api/internal/jobs/tick"
      InvocationRateLimitPerSecond: 1

  JobsInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-relay-jobs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: events:InvokeApiDestination
                Resource: !GetAtt JobsDestination.Arn

  JobsSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Run Relay background jobs (emails, reminders, expiries)
      ScheduleExpression: rate(1 minute)
      State: ENABLED
      Targets:
        - Id: relay-jobs
          Arn: !GetAtt JobsDestination.Arn
          RoleArn: !GetAtt JobsInvokeRole.Arn
          RetryPolicy:
            MaximumRetryAttempts: 0
            MaximumEventAgeInSeconds: 60

Outputs:
  ApiUrl:
    Description: Backend address. Put it in the Amplify rewrites (deploy/aws/amplify-rewrites.json)
    Value: !Sub "https://${Api.ServiceUrl}"
  DatabaseHost:
    Value: !GetAtt Database.Endpoint.Address
