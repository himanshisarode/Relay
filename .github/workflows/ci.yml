# Runs when relay/ is its own repository (or move to the repo root and prefix paths with relay/).
name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: relay, POSTGRES_PASSWORD: relay, POSTGRES_DB: relay_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U relay" --health-interval 3s --health-retries 20
    defaults: { run: { working-directory: backend } }
    env:
      RELAY_TEST_DATABASE_URL: postgresql+psycopg://relay:relay@localhost:5432/relay_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: ruff check app tests scripts
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - run: npx vite build
  deploy-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install cfn-lint
      - run: cfn-lint --regions ap-south-1 -- deploy/aws/backend.yml
      - run: docker build --platform linux/amd64 -t relay-backend backend
