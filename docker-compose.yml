# Local development: `docker compose up --build`
#   App        http://localhost:5173   (seeded logins: see README, password relay-demo-pass)
#   API docs   http://localhost:8000/api/docs
#   Mailpit    http://localhost:8025   (every email the app sends lands here)
name: relay

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["8025:8025", "1025:1025"]

  api:
    build: ./backend
    command: sh -c "alembic upgrade head && python -m scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment: &backend-env
      RELAY_DATABASE_URL: postgresql+psycopg://relay:relay@db:5432/relay
      RELAY_TEST_DATABASE_URL: postgresql+psycopg://relay:relay@db:5432/relay_test
      RELAY_BASE_URL: http://localhost:5173
      RELAY_COOKIE_SECURE: "false"
      # Never "true" while the public tunnel is up: it would hand out password-reset tokens.
      RELAY_DEV_EXPOSE_TOKENS: "${RELAY_DEV_EXPOSE_TOKENS:-false}"
      RELAY_SMTP_HOST: mailpit
      RELAY_SMTP_PORT: "1025"
    volumes: ["./backend:/app"]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  worker:
    build: ./backend
    command: sh -c "sleep 5 && python -m app.worker.main"
    environment: *backend-env
    volumes: ["./backend:/app"]
    depends_on:
      db: { condition: service_healthy }
      api: { condition: service_started }

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY: http://api:8000
      VITE_POLL: "1"
    volumes: ["./frontend:/app", "frontend_node_modules:/app/node_modules"]
    ports: ["5173:5173"]
    depends_on: [api]

  # Public demo link: `docker compose --profile public up -d`, then `docker compose logs tunnel` shows the
  # https://<random>.trycloudflare.com address. It works only while this computer and Docker are running.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [public]
    command: tunnel --no-autoupdate --url http://frontend:5173
    depends_on: [frontend]

volumes:
  pgdata:
  frontend_node_modules:
