# Production (plan Q7): one VM, `docker compose -f docker-compose.prod.yml --env-file .env up -d --build`
# Caddy terminates HTTPS automatically for RELAY_DOMAIN, serves the built frontend and proxies /api to FastAPI.
name: relay-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: relay
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    environment: &env
      RELAY_DATABASE_URL: postgresql+psycopg://relay:${POSTGRES_PASSWORD}@db:5432/relay
      RELAY_BASE_URL: https://${RELAY_DOMAIN:?set RELAY_DOMAIN in .env}
      RELAY_COOKIE_SECURE: "true"
      RELAY_SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
      RELAY_SMTP_PORT: ${SMTP_PORT:-587}
      RELAY_SMTP_USER: ${SMTP_USER:-}
      RELAY_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      RELAY_SMTP_FROM: ${SMTP_FROM:-Relay <no-reply@example.org>}
      RELAY_SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    depends_on:
      db: { condition: service_healthy }

  worker:
    build: ./backend
    restart: unless-stopped
    command: python -m app.worker.main
    environment: *env
    depends_on: [api]

  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes: [caddy_data:/data, caddy_config:/config]
    depends_on: [api]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes: ["${BACKUP_DIR:-./backups}:/backups", "./deploy/backup.sh:/backup.sh:ro"]
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  caddy_data:
  caddy_config:
