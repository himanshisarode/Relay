# Relay seed data: departments, labs, professors, members and resources.
# Generated from ../../instruments_list (all names fictional), then hand-editable.
#   policy:  lab_only | department | institute_approval | institute_open
#   profile: booking-rule preset from `profiles` (open_time == close_time means open 24 h)
# Every seeded account uses the dev password in seed.py; never use these in production.
profiles:
  standard:
    slot_granularity_min: 30
    min_duration_min: 30
    max_duration_min: 240
    open_time: '08:00'
    close_time: '20:00'
    max_advance_days: 14
    min_notice_min: 30
    weekly_quota_min: 600
    cancellation_cutoff_min: 120
  long_run:
    slot_granularity_min: 60
    min_duration_min: 120
    max_duration_min: 720
    open_time: '07:00'
    close_time: '22:00'
    max_advance_days: 30
    min_notice_min: 120
    weekly_quota_min: 1440
    cancellation_cutoff_min: 1440
  compute:
    slot_granularity_min: 60
    min_duration_min: 60
    max_duration_min: 1440
    open_time: '00:00'
    close_time: '00:00'
    max_advance_days: 14
    min_notice_min: 0
    weekly_quota_min: 2880
    cancellation_cutoff_min: 60
  meeting:
    slot_granularity_min: 30
    min_duration_min: 30
    max_duration_min: 180
    open_time: '08:00'
    close_time: '20:00'
    max_advance_days: 60
    min_notice_min: 0
    weekly_quota_min: null
    cancellation_cutoff_min: 60
